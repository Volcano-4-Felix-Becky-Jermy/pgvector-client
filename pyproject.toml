[project]
name = "pgvector-client"
version = "0.1.0"
description = "Shared PostgreSQL helpers for social media vector search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain_postgres"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]